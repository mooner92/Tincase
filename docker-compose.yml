# OPS — 운영 compose. 반드시 127.0.0.1 바인딩 (OPS-03/AU-01).
services:
  app:
    build: .
    image: repman:latest
    container_name: repman
    restart: unless-stopped
    ports:
      # ADR-0006 — 사내망 직접 접속(비밀번호 로그인)을 허용하므로 LAN에 노출한다.
      # 이는 v1.0.0의 127.0.0.1 전용 정책을 의도적으로 개정한 것이며,
      # 인증은 앱의 세션·JWT 검증이 담당한다 (AU-20~26). 인증 없는 노출이 아니다.
      - "0.0.0.0:11111:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul                     # OPS-04c — 코드는 이것 없이도 옳다 (WS-07)
      DATABASE_URL: file:/data/db/worklog.db
      STORAGE_ROOT: /data
      CF_ACCESS_TEAM: aidt-kei
      # HM-24 — 병합 보조 모델. Tincase 전용 ollama (pm2 tincase-ollama, 도커 브리지 바인딩).
      # 다른 인스턴스(11434/11435 jhkim, 11436 kei-ollama-v031)는 건드리지 않는다.
      # 비워두면 결정론 병합만 수행한다 — 모델은 얹는 층이지 의존 대상이 아니다.
      MERGE_MODEL: hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M
      MERGE_MODEL_URL: http://host.docker.internal:11437
      # CF_ACCESS_AUD는 .env.production(env_file)에서. 누락 시 앱 env 가드가 기동 거부 (OPS-06)
      # NT-01 — 메신저 주소·허용 사번도 .env.production에서 받는다.
      # 사내 IP를 여기 적지 않는 이유: 이 파일은 커밋된다 (공개 저장소).
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 컨테이너 → 호스트 ollama (서브넷 변경에 안전)
    env_file:
      - .env.production                  # CF_ACCESS_AUD만 담는다 (git 제외)
    volumes:
      - /data/worklog:/data              # ST-00 — 22TB 로컬 디스크. 홈·/srv 금지
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # OPS-19 — 루트 디스크 보호

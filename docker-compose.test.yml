# RU-40~43 — **테스트 서버 (11112).** 운영(docker-compose.yml)과 완전히 분리한다.
#
#   bash scripts/deploy.sh test      (sudo 없이 — 아래 compose를 sudo로 부르고, 끝나면 빌드 찌꺼기를 치운다: OPS-43)
#   = sudo docker compose -f docker-compose.test.yml -p repman-test build && … up -d
#
# RU-45 — **시연 모드.** 운영회의 강당 화면도 이 컨테이너(11112) 하나로 띄운다 — 포트·인스턴스를 더 두지 않는다
# (2026-10-08, 사용자 요청: 「11113은 쓰지마. 11112에서만」). 평소 데이터(/data/worklog-test)는 운영 사본이라 실명이 있어
# 프로젝터에 띄울 수 없다. 그래서 **스위치 하나**(TINCASE_TEST_MODE)로 같은 컨테이너를 가짜 사람만 있는 저장소에 붙인다:
#
#   TINCASE_TEST_MODE=demo bash scripts/deploy.sh test --no-build   ← 시연 데이터로 전환 (굽지 않는다)
#   TINCASE_TEST_MODE=test bash scripts/deploy.sh test --no-build   ← 되돌리기 (시연으로 떠 있으면 변수 없이는 멈춘다 — OPS-43h)
#   sudo bash scripts/demo-snapshot.sh status                       ← 지금 어느 쪽인지
#
# 스크립트는 sudo 없이 부른다 — 변수를 받아 sudo **뒤에** 붙여 넘긴다. 손으로 compose를 부르면 변수를 sudo 앞에 둔 순간
# sudo가 지워 테스트 데이터(실명)로 뜬다(RU-45). 절차·주의: docs/DEMO.md
# 왜 변수가 하나인가: 저장소·띠·쿠키를 따로 고르게 하면 「실명 DB 위에 '모두 지어낸 것' 띠」가 가능해진다. 셋이 같은 값을 따른다.
# 분리하는 것 — 컨테이너·이미지 태그·DB·저장소·세션 쿠키 이름.
# 끄는 것     — 실제 메신저(알림은 같은 컨테이너의 **가짜 알림 수신함**으로 — NT-56)·자동 병합 스케줄러·Cloudflare·hwp 업로드 제출(ADR-0014).
# .env.production을 읽지 않는다 — 거기 든 메신저 설정이 딸려 오면 테스트에서 실제 알림이 나간다.
#
# OPS-47 — **리허설**(scripts/rehearsal.ts · docs/REHEARSAL.md)은 시연 모드에서 자동 병합 스케줄러를 켠다 — 덧붙이는 compose
# (docker-compose.rehearsal.yml)로. 이 파일의 변수는 TINCASE_TEST_MODE 하나 그대로다(저장소·띠·쿠키를 따로 고를 길이 없다):
#   TINCASE_TEST_MODE=demo TINCASE_REHEARSAL=on bash scripts/deploy.sh test --no-build    ← 리허설 시작
#   TINCASE_TEST_MODE=demo bash scripts/deploy.sh test --no-build                         ← 끝 (스케줄러 꺼짐)
# 평소 모드(실명 사본)에서 켜려 하면 스크립트가 멈춘다.
services:
  app-test:
    build: .
    image: repman:test
    container_name: repman-test
    restart: unless-stopped
    ports:
      - "0.0.0.0:11112:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      # RU-43 — 화면 맨 위 「테스트 서버」 띠. 시연 모드면 RU-47 「시연 — 사람과 업무는 모두 지어낸 것입니다」 띠
      TINCASE_ENV: ${TINCASE_TEST_MODE:-test}
      DATABASE_URL: file:/data/db/worklog.db
      STORAGE_ROOT: /data
      # Cloudflare 경로는 **통과할 수 없게** 막는다 — 사내 비밀번호 로그인만 남는다.
      # 운영에서 AUD가 필수인 이유(AU-02)는 「비면 검증이 무력화되기 때문」이다. 여기는 반대로
      # 어떤 Cloudflare 앱에도 없는 무작위 값을 넣어, 그 값과 맞는 토큰을 만들 길을 없앤다.
      # (비밀이 아니다 — 맞는 토큰이 존재할 수 없다는 것이 이 값의 역할이다)
      CF_ACCESS_TEAM: tincase-test-disabled
      CF_ACCESS_AUD: "3cdf50b28c6381d2564643173f971de6487daa825dfaaacd458aa0691f2a3c0a"
      # RU-42 — 운영 로그인과 섞이지 않게. 시연 모드는 repman_demo_session — 모드를 오가도 서로의 로그인을 지우지 않는다
      # (강당 PC의 역할별 로그인이 리허설부터 회의 날까지 산다. 쿠키는 포트가 아니라 호스트 단위라 이름으로 가른다)
      SESSION_COOKIE_NAME: repman_${TINCASE_TEST_MODE:-test}_session
      # NT-56 · OPS-46 — 알림은 **이 컨테이너 안의 가짜 수신함**으로 간다. 클라이언트는 진짜 메신저와 똑같이 보내고, 밖으로는 아무것도
      # 나가지 않는다. 운영자 화면 /ops/notify-sink에서 「무엇이 누구에게 언제」를 본다. 앱은 시험·시연 서버(TINCASE_ENV)에서
      # 수신함이 아닌 메신저 주소를 받으면 뜨지 않는다 — 이 줄을 실제 주소로 바꾸는 실수가 곧 기동 실패다.
      # 허용 목록 「*」: 허용 목록(NT-03)은 「실제 사람 누구에게 보내도 되나」를 거르는 마지막 문이다. 여기서 받는 곳은 이 앱 자신이라
      # 거를 사람이 없고, 거르면 「누구에게 갔을 것인가」가 수신함에 남지 않는다. 운영의 허용 목록은 .env.production에만 있다
      MESSENGER_URL: http://127.0.0.1:3000/api/dev/messenger-sink
      MESSENGER_SINK: "on"
      MESSENGER_ALLOWLIST: "*"
      MERGE_SCHEDULER: "off"                  # RU-41 — 병합은 버튼으로만. 리허설만 덧붙이는 compose로 켠다(OPS-47 — 위 머리 주석)
      # RU-60a · ADR-0014 — 「전사」 게시판 hwp [올리기]를 닫는다(410, 버튼도 없다). 부서원의 hwp 업로드 제출은
      # 2026-10-08에 코드째 없어져(WA-39) 이 값과 상관없다. [올리기]가 걷히면 이 줄도 지운다
      SUBMIT_HWP_UPLOAD: "off"
      MERGE_MODEL: hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M
      MERGE_MODEL_URL: http://host.docker.internal:11437
      # HM-52 · HM-57 — 모델 호출 한 번의 제한. 모델 문을 통과한 **뒤부터** 잰다(줄에서 기다린 시간은 빼고).
      # 코드 기본값과 같지만 적어 둔다 — 기본값에 기대면 「지금 몇 초인가」를 코드에서 찾아야 한다
      MERGE_MODEL_TIMEOUT_MS: "60000"
      # HM-53 — 운영과 같은 모델 서버의 같은 모델이라 상주(-1)를 함께 쓴다. 스케줄러가 꺼져 있어 기동 때 데우지는 않는다 —
      # 첫 [지금 병합]이 올리고, 올린 모델은 내려가지 않는다
      MERGE_MODEL_KEEP_ALIVE: "-1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 기본 /data/worklog-test(운영 사본 — 실명) · 시연 모드 /data/worklog-demo(가짜 사람만, scripts/demo-seed.ts가 만든다)
      - /data/worklog-${TINCASE_TEST_MODE:-test}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
